# Phase-53A: Prometheus scrape configuration for AI Sandbox Platform
# Scrapes ai-service GET /metrics endpoint (Phase-52)
# Phase-53C: Alert rules for execution, queue, and worker health

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: aisandbox-ai-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - ai-service:4001
        # Multi-worker: add additional targets as needed:
        # - ai-service-1:4001
        # - ai-service-2:4001
