# Production Docker Compose - AI Sandbox Platform
# Usage: docker compose -f docker-compose.prod.yml up -d
# See docs/PRODUCTION-DEPLOYMENT-RUNBOOK.md
# Security: docs/PRODUCTION-SECURITY.md

services:
  # --- Infrastructure (internal only) ---
  postgres:
    image: postgres:15-alpine
    container_name: aisandbox-postgres
    restart: unless-stopped
    env_file:
      - ./.env
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/schema:ro
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
    networks:
      - aisandbox-network

  redis:
    image: redis:7-alpine
    container_name: aisandbox-redis
    restart: unless-stopped
    env_file:
      - ./.env
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - aisandbox-network

  # --- Application Services ---
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: aisandbox-api-gateway
    restart: unless-stopped
    env_file:
      - ./.env
    security_opt:
      - no-new-privileges:true
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MAX_ACTIVE_SESSIONS_PER_USER: ${MAX_ACTIVE_SESSIONS_PER_USER:-1000000}
      MAX_SESSIONS_PER_24H: ${MAX_SESSIONS_PER_24H:-1000000}
      JWT_EXPIRES_IN: "30d"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      CONTAINER_MANAGER_URL: http://container-manager:4002
      AI_PROVIDER: ${AI_PROVIDER}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-stub}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    volumes:
      - api_gateway_data:/database
      - api_gateway_snapshot_store_data:/snapshot-store
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/api/health',r=>{r.resume();process.exit(r.statusCode===200?0:1);}).on('error',()=>process.exit(1));\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - aisandbox-network

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    security_opt:
      - no-new-privileges:true
    volumes:
      - ai_service_data:/database
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      API_GATEWAY_URL: http://api-gateway:4000
      CONTAINER_MANAGER_URL: http://container-manager:4002
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      AI_PROVIDER: ${AI_PROVIDER}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - aisandbox-network
    # Scale: docker compose -f docker-compose.prod.yml up -d --scale ai-service=2

  container-manager:
    build:
      context: ./services/container-manager
      dockerfile: Dockerfile
    container_name: aisandbox-container-manager
    restart: unless-stopped
    env_file:
      - ./.env
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - container_manager_data:/database
    environment:
      NODE_ENV: production
      PORT: 4002
      API_GATEWAY_URL: http://api-gateway:4000
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      DOCKER_HOST: unix:///var/run/docker.sock
    depends_on:
      - api-gateway
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - aisandbox-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_GATEWAY_URL: http://api-gateway:4000
        NEXT_PUBLIC_PROJECT_FIRST_UX: "true"
    container_name: aisandbox-frontend
    restart: unless-stopped
    env_file:
      - ./.env
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - api-gateway
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - aisandbox-network

  # --- Observability (internal + optional external) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: aisandbox-prometheus
    restart: unless-stopped
    env_file:
      - ./.env
    security_opt:
      - no-new-privileges:true
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M
    networks:
      - aisandbox-network

  grafana:
    image: grafana/grafana:latest
    container_name: aisandbox-grafana
    restart: unless-stopped
    env_file:
      - ./.env
    security_opt:
      - no-new-privileges:true
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - aisandbox-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_gateway_data:
  api_gateway_snapshot_store_data:
  ai_service_data:
  container_manager_data:

networks:
  aisandbox-network:
    driver: bridge
