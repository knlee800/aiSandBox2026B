# Production Docker Compose - AI Sandbox Platform
# Usage: docker compose -f docker-compose.prod.yml up -d
# See docs/PRODUCTION-DEPLOYMENT-RUNBOOK.md

services:
  # --- Infrastructure (internal only) ---
  postgres:
    image: postgres:15-alpine
    container_name: aisandbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aisandbox-network

  redis:
    image: redis:7-alpine
    container_name: aisandbox-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aisandbox-network

  # --- Application Services ---
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: aisandbox-api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      CONTAINER_MANAGER_URL: http://container-manager:4002
      AI_PROVIDER: ${AI_PROVIDER:-stub}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aisandbox-network

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4001
      REDIS_URL: ${REDIS_URL}
      API_GATEWAY_URL: http://api-gateway:4000
      CONTAINER_MANAGER_URL: http://container-manager:4002
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-stub}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aisandbox-network
    # Scale: docker compose -f docker-compose.prod.yml up -d --scale ai-service=2

  container-manager:
    build:
      context: ./services/container-manager
      dockerfile: Dockerfile
    container_name: aisandbox-container-manager
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: production
      PORT: 4002
      API_GATEWAY_URL: http://api-gateway:4000
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      DOCKER_HOST: unix:///var/run/docker.sock
    depends_on:
      - api-gateway
    networks:
      - aisandbox-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_GATEWAY_URL: http://api-gateway:4000
    container_name: aisandbox-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - api-gateway
    networks:
      - aisandbox-network

  # --- Observability (internal + optional external) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: aisandbox-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
    networks:
      - aisandbox-network

  grafana:
    image: grafana/grafana:latest
    container_name: aisandbox-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - aisandbox-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  aisandbox-network:
    driver: bridge
